<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Information — B-Lite Food</title>
  <meta name="theme-color" content="#F5223A">
  <link rel="icon" href="assets/img/brand/favicon-32.png" sizes="32x32">
  <link rel="icon" href="assets/img/brand/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/blite.css?v=12">
  <script src="assets/js/data.js?v=12"></script><script src="assets/js/art.js?v=12"></script><script src="assets/js/app.js?v=12"></script>
</head>
<body data-page="legal">
<main id="main">
  <section class="page-hero" style="padding-bottom:28px"><div class="container"><nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span data-crumb></span></nav><h1 class="h1" data-title></h1><p class="muted small" data-updated></p></div></section>
  <section class="section" style="padding-top:32px">
    <div class="container" style="display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;align-items:start" data-layout>
      <nav class="acct-nav" aria-label="Policies" data-nav></nav>
      <article data-body></article>
    </div>
  </section>
</main>
<style>@media (max-width: 900px) { [data-layout] { grid-template-columns: 1fr !important; gap: 20px !important; } }</style>
<script>
/* Policy text imported from blitefood.co.uk/guide (Terms & Conditions, effective 20/10/2025) and
   blitefood.co.uk/policy (Sept 2026). Pages marked "draft" were written for the redesign and are not on the live site. */
Blite.ready(function () {
  var B = Blite, D = BliteData, $ = B.$, I = B.icon, biz = D.business;
  var tel = '<a href="tel:' + biz.phoneHref + '">' + biz.phone + '</a>';
  var info = '<a href="mailto:' + biz.infoEmail + '">' + biz.infoEmail + '</a>';
  var draft = '<div class="notice notice--warn" style="margin-bottom:28px">' + I("info") + '<span><strong>Draft for review.</strong> This page is new in the redesign and is not on the current website. It must be reviewed by the business and a qualified adviser before launch.</span></div>';
  var live = function (src) { return '<p class="small muted" style="margin-bottom:24px">From our ' + src + '.</p>'; };
  var contact = '<h2>Contact us</h2><p>Email: ' + info + '<br>Phone: ' + tel + '<br>Address: ' + biz.address + ', UK</p>';

  var pages = {
    delivery: ["Delivery information", '<div class="prose">' + live("delivery policy") +
      '<h2>When we deliver</h2><ul>' +
        '<li>We take orders from 07:00 to 19:00.</li>' +
        '<li>Deliveries run <strong>' + biz.deliveryHours + '</strong>.</li>' +
        '<li><strong>Quick meals</strong> can be delivered the same day.</li>' +
        '<li>Everything else is cooked fresh to order — please order <strong>a day in advance</strong> for guaranteed availability.</li></ul>' +
      '<h2>Delivery fees</h2><p>Delivery fees depend on your location and are shown before checkout. Enter your postcode at checkout to see whether we cover you and what it costs.</p>' +
      '<div class="notice notice--info" style="margin:8px 0 20px">' + I("info") + '<span>The postcode areas and fees used by the checkout in this prototype are placeholders and still need to be confirmed.</span></div>' +
      '<h2>Missed deliveries</h2><p>Delivery times are estimates and may vary with demand, distance or weather. Please make sure your delivery details are accurate — if you miss your delivery or give an incorrect address, a redelivery charge may apply.</p>' +
      '<h2>Collection</h2><p>You can also collect from ' + biz.address + '. We\'ll let you know when your order is ready.</p>' +
      '<h2>If something goes wrong</h2><p>Call ' + tel + ' as soon as possible and we\'ll put it right. See <a href="legal.html?page=refunds">refunds</a>.</p></div>'],

    allergens: ["Allergen information", '<div class="prose">' +
      '<div class="notice notice--warn" style="margin-bottom:24px">' + I("alert") + '<span><strong>Please tell us about any allergy or intolerance before you order.</strong> Call ' + tel + ' or add it to your order notes and we\'ll confirm what\'s in each dish.</span></div>' +
      '<ul><li>Although we take precautions, our kitchen handles all 14 major allergens, so we cannot guarantee any meal is free from traces.</li>' +
      '<li>We are not liable for allergic reactions where no allergy was disclosed at the time of ordering.</li></ul>' +
      '<h2>The 14 major allergens</h2><p>' + Object.keys(D.allergenNames).map(function (k) { return D.allergenNames[k]; }).join(" · ") + '</p>' +
      '<p class="small muted">A dish-by-dish allergen chart will appear here once each recipe\'s allergens have been confirmed by the kitchen.</p></div>'],

    terms: ["Terms & conditions", '<div class="prose">' + live("Terms & Conditions, effective 20 October 2025") +
      '<p><strong>Company:</strong> ' + biz.legalName + ', registered in the United Kingdom.</p>' +
      '<h2>1. Introduction</h2><p>Welcome to B-Lite Food, a UK-based food service brand bringing authentic Nigerian delicacies to your table. By using our website, placing an order or using our services, you agree to these Terms and Conditions. If you do not agree with any part of them, please do not use our website or services.</p>' +
      '<h2>2. Eligibility</h2><p>You must be at least 18 years old to place an order. By ordering, you confirm that the information you provide is accurate and up to date, and that you are legally capable of entering into a binding agreement.</p>' +
      '<h2>3. Ordering and payments</h2><ul><li>Orders can be made through our website, phone line or authorised partner platforms.</li><li>Please place orders at least one day before your delivery date.</li><li>All prices include VAT where applicable.</li><li>Payment is taken in full when you order.</li></ul>' +
      '<h2>4. Delivery and collection</h2><ul><li>Delivery times are estimates and may vary with demand, distance or weather.</li><li>You are responsible for giving accurate delivery information.</li><li>Once an order has been delivered or collected, we are not responsible for its condition beyond that point.</li></ul>' +
      '<h2>5. Cancellations and refunds</h2><ul><li>Orders may be cancelled within 30 minutes of being placed.</li><li>Because our food is perishable, refunds are only issued if the order was incorrect or we failed to deliver it.</li><li>Refund claims must be made within 24 hours of delivery, with proof (for example, a photo).</li></ul>' +
      '<h2>6. Allergies and dietary information</h2><ul><li>Please tell us about any allergies or intolerances before ordering.</li><li>Although we take precautions, we cannot guarantee our meals are free from trace allergens.</li><li>We are not liable for allergic reactions where no allergy was disclosed when ordering.</li></ul>' +
      '<h2>7. Website use</h2><p>The content on this website, including text, images and branding, belongs to B-Lite Food. You may not copy, reproduce or redistribute it without written permission. We may change or remove any content or service at our discretion.</p>' +
      '<h2>8. Limitation of liability</h2><p>We are not liable for delays caused by third parties or events beyond our control (such as traffic, strikes or weather), losses caused by inaccurate customer information, or food quality issues caused by improper handling after delivery. Our total liability for any claim will not exceed the amount paid for the order in question.</p>' +
      '<h2>9. Privacy and data</h2><p>We collect and store your personal information in line with UK GDPR. See our <a href="legal.html?page=privacy">privacy policy</a>.</p>' +
      '<h2>10. Governing law</h2><p>These terms are governed by the laws of England and Wales, and any disputes will be handled by the UK courts.</p>' +
      contact + '</div>'],

    refunds: ["Refunds", '<div class="prose">' + live("refund policy") +
      '<p>Because our meals are freshly prepared, refunds can only be issued if:</p><ul><li>you received the wrong order,</li><li>the food arrived damaged or unsafe, or</li><li>we failed to deliver your order.</li></ul>' +
      '<h2>How to request a refund</h2><ol><li>Contact us within 1–6 hours of ordering your meal.</li><li>Give your order number and a photo where relevant.</li><li>Refunds are processed within 5–7 working days after we\'ve checked your claim.</li></ol>' +
      '<p>You can cancel an order within 30 minutes of placing it.</p>' + contact + '</div>'],

    privacy: ["Privacy policy", '<div class="prose">' + live("privacy policy") +
      '<p>B-Lite Food respects your privacy. We collect and use customer data only to process orders, improve our services and send relevant updates. We do not sell, rent or share your information with third parties for marketing.</p>' +
      '<h2>What we collect</h2><ul><li>Name, phone number and delivery address (for orders)</li><li>Payment details (processed securely by third-party payment providers — we never store your card number)</li><li>Email address (for order updates, and promotions if you opt in)</li></ul>' +
      '<h2>Your rights</h2><p>You can ask to access, correct or delete your personal data by emailing ' + info + '. All data is stored securely and processed in line with UK GDPR and the Data Protection Act 2018. You can also complain to the Information Commissioner\'s Office (ico.org.uk).</p>' +
      '<div class="notice notice--info" style="margin-top:20px">' + I("info") + '<span><strong>For review before launch:</strong> UK GDPR also expects the lawful basis for each use, how long data is kept, and which providers process it (for example payments, email and hosting). The live policy doesn\'t yet cover these.</span></div></div>'],

    cookies: ["Cookie policy", draft + '<div class="prose"><h2>Strictly necessary</h2><p>These keep your basket, checkout, sign-in and security working. They don\'t need consent and can\'t be switched off.</p>' +
      '<h2>Analytics (optional)</h2><p>Helps us understand which pages are useful. Off unless you accept.</p><h2>Marketing (optional)</h2><p>Measures our social adverts. Off unless you accept.</p>' +
      '<p><button class="btn btn--sm" data-cookie-prefs>Manage cookie preferences</button></p></div>'],

    hygiene: ["Food safety & hygiene", '<div class="prose">' + live("food safety & hygiene policy") +
      '<p>We maintain the highest hygiene and safety standards.</p><ul><li>Meals are prepared daily in a licensed, fully compliant kitchen.</li><li>Staff are trained in UK food hygiene and safety.</li><li>Ingredients are locally sourced and stored in temperature-controlled conditions.</li></ul>' +
      '<p>We\'re committed to keeping our food fresh, safe and delicious — authentic Nigerian flavours you can trust.</p></div>'],

    sustainability: ["Sustainability", '<div class="prose">' + live("environmental and sustainability policy") +
      '<p>We recognise our responsibility to the environment.</p><ul><li>We minimise food waste through responsible portioning and preparation.</li><li>We use recyclable and biodegradable packaging where possible.</li><li>We support local suppliers to reduce our carbon footprint.</li></ul>' +
      '<p>Our goal is to grow sustainably while staying true to our roots.</p>' +
      '<h2>Our commitment to you</h2><ul><li>Deliver authentic Nigerian flavours with consistency and care.</li><li>Save you time, stress and effort in the kitchen.</li><li>Be transparent and honest in every part of our service.</li></ul></div>'],

    "catering-terms": ["Catering terms", draft + '<div class="prose"><ul><li>Catering is quoted per event. A deposit secures your date; the balance is due before the event.</li><li>Final guest numbers and any dietary or allergy requirements should be confirmed in writing before the event.</li><li>Cancellation terms are set out in your quote.</li></ul></div>'],

    "rental-terms": ["Equipment hire terms", draft + '<div class="prose"><ul><li>Hire prices are per item or per pack as listed (for example, cutlery and plates in packs of 20).</li><li>Equipment should be returned clean of food. Missing or damaged items may be charged at replacement cost.</li><li>Delivery and collection can be arranged — ask when you request a quote.</li></ul></div>'],
  };
  var key = pages[B.params.get("page")] ? B.params.get("page") : "delivery";
  var p = pages[key];
  document.title = p[0] + " — B-Lite Food";
  $("[data-title]").textContent = p[0];
  $("[data-crumb]").textContent = p[0];
  $("[data-updated]").textContent = key === "terms" ? "Effective 20 October 2025" : "";
  $("[data-body]").innerHTML = p[1];
  $("[data-nav]").innerHTML = Object.keys(pages).map(function (k) { return '<a href="legal.html?page=' + k + '" aria-current="' + (k === key) + '">' + pages[k][0] + '</a>'; }).join("") + '<a href="contact.html">Contact</a>';
});
</script>
</body>
</html>
