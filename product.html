<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B-Lite Food</title>
  <meta name="theme-color" content="#F5223A">
  <link rel="icon" href="assets/img/brand/favicon-32.png" sizes="32x32">
  <link rel="icon" href="assets/img/brand/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/blite.css?v=12">
  <script src="assets/js/data.js?v=12"></script><script src="assets/js/art.js?v=12"></script><script src="assets/js/app.js?v=12"></script>
</head>
<body data-page="menu" data-header="solid">
<div class="header-spacer"></div>
<main id="main" class="section" style="padding-top:28px">
  <div class="container" data-pd></div>
  <div class="container" style="margin-top:72px" data-related-wrap>
    <div class="sec-head"><div><span class="eyebrow">You might also like</span><h2 class="h2">Goes well with</h2></div></div>
    <div class="grid grid-4" data-related></div>
  </div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Product photo">
  <button class="icon-btn lb-close" data-lb="close" aria-label="Close" data-icon="close"></button>
  <button class="icon-btn lb-prev" data-lb="prev" aria-label="Previous photo" data-icon="chev-left"></button>
  <div class="lightbox__stage"></div>
  <button class="icon-btn lb-next" data-lb="next" aria-label="Next photo" data-icon="chev-right"></button>
</div>

<script>
Blite.ready(function () {
  var B = Blite, D = BliteData, $ = B.$, $$ = B.$$, I = B.icon;
  var p = B.product(B.params.get("id"));
  var root = $("[data-pd]");
  if (!p) {
    root.innerHTML = '<div class="state"><div class="state__icon">' + I("search") + '</div><h3>We couldn\'t find that dish.</h3><p>It may have come off the menu. Take a look at what\'s cooking today.</p><a class="btn" href="menu.html">Browse the menu ' + I("arrow") + '</a></div>';
    $("[data-related-wrap]").hidden = true;
    return;
  }
  document.title = p.name + " — B-Lite Food";
  var cat = D.categories.find(function (c) { return c.id === p.cat; });
  var allergens = (p.allergens || []).map(function (a) { return D.allergenNames[a].toLowerCase(); });

  root.innerHTML =
    '<a class="text-link" href="menu.html' + (cat ? "?cat=" + cat.id : "") + '" style="margin-bottom:20px">' + I("arrow-left", "i-sm") + ' Back to menu</a>' +
    '<div class="pd" style="margin-top:16px">' +
      '<div class="pd-gallery">' +
        '<div class="pd-main" data-open-lb><div class="pd-track" data-track>' + p.images.map(function (src, i) { return B.productImg(p, i); }).join("") + '</div>' +
        '<button class="fav-btn" data-fav="' + p.id + '" aria-pressed="' + B.isFav(p.id) + '" aria-label="Save to favourites" style="top:16px;right:16px;width:44px;height:44px">' + I("heart") + '</button></div>' +
        '<div class="dots mobile-only" style="display:none" data-dots>' + p.images.map(function (_, i) { return '<span class="' + (i ? "" : "is-on") + '"></span>'; }).join("") + '</div>' +
        (p.images.length > 1 ? '<div class="pd-thumbs">' + p.images.map(function (_, i) { return '<button data-thumb="' + i + '" aria-label="Photo ' + (i + 1) + '" aria-current="' + (i === 0) + '">' + B.productImg(p, i) + '</button>'; }).join("") + '</div>' : '') +
      '</div>' +
      '<div class="pd-info">' +
        '<span class="eyebrow">' + (cat ? cat.title : "") + '</span>' +
        '<h1 class="h2">' + B.esc(p.name) + '</h1>' +
        '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px"><span class="pd-price" data-price></span></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">' + (p.quick ? '<span class="pill pill--green">' + I("truck", "i-sm") + ' Quick meal — same day</span>' : '<span class="pill pill--orange">' + I("clock", "i-sm") + ' Order by 19:00 for next-day delivery</span>') +
          (p.prep ? '<span class="pill pill--muted">' + I("clock", "i-sm") + ' Freshly cooked · ' + B.esc(p.prep) + '</span>' : '') + '</div>' +
        '<p style="margin-bottom:22px">' + B.esc(p.long || p.desc) + '</p>' +
        '<div class="allergen-box" style="margin-bottom:8px">' + I("info") + '<div><strong>Allergens.</strong> ' + (p.allergens === null ? "Please tell us about any allergy or intolerance before you order — we'll confirm what's in this dish." : allergens.length ? "Contains: " + allergens.join(", ") + "." : "No major allergens as an ingredient.") +
          ' Prepared in a kitchen that handles all 14 allergens, so we cannot guarantee any dish is free from traces. <a href="legal.html?page=allergens">View allergen information</a></div></div>' +
        (p.portions.length > 1 ? '<div class="pd-block"><h3>Choose your portion <small>Required</small></h3><div style="display:grid;gap:8px" data-portions>' +
          p.portions.map(function (o, i) { return '<label class="radio-card"><input type="radio" name="portion" value="' + o.id + '"' + (i ? "" : " checked") + '><span class="rc-main"><span class="rc-title">' + o.name + '</span></span><span class="price">' + B.money(o.price) + '</span></label>'; }).join("") + '</div></div>' : "") +
        (p.addons.length ? '<div class="pd-block"><h3>Add-ons <small>Optional</small></h3><div style="display:grid;gap:8px" data-addons>' +
          p.addons.map(function (a) { return '<label class="check"><input type="checkbox" value="' + a.id + '"><span style="flex:1;font-weight:500;color:var(--dark)">' + a.name + '</span><span class="muted">+' + B.money(a.price) + '</span></label>'; }).join("") + '</div></div>' : "") +
        '<div class="pd-block pd-cta-wrap"><div class="pd-cta"><div class="qty qty--lg"><button data-q="-1" aria-label="Decrease quantity">' + I("minus") + '</button><output data-qty>1</output><button data-q="1" aria-label="Increase quantity">' + I("plus") + '</button></div>' +
          '<button class="btn" data-add-pd>Add to basket — <span data-total></span></button></div></div>' +
      '</div>' +
    '</div>';

  $$("[data-stars]", root).forEach(function (el) { el.innerHTML = Array(6).join(I("star")); });

  var qty = 1;
  function opts() {
    var por = $("input[name=portion]:checked", root);
    return { portion: por ? por.value : p.portions[0].id, addons: $$("[data-addons] input:checked", root).map(function (i) { return i.value; }), qty: qty };
  }
  function paintPrice() {
    var o = opts(), unit = B.unitPrice({ id: p.id, portion: o.portion, addons: o.addons });
    $("[data-price]").textContent = B.money(unit);
    $("[data-total]").textContent = B.money(unit * qty);
    $("[data-qty]").textContent = qty;
    $("[data-q='-1']").disabled = qty <= 1;
  }
  paintPrice();
  root.addEventListener("change", paintPrice);
  root.addEventListener("click", function (e) {
    var q = e.target.closest("[data-q]");
    if (q) { qty = Math.max(1, Math.min(20, qty + Number(q.dataset.q))); paintPrice(); }
    if (e.target.closest("[data-add-pd]")) {
      var btn = e.target.closest("[data-add-pd]");
      if (B.addToCart(p.id, opts()) === false) return;
      btn.innerHTML = I("check") + " Added to basket";
      setTimeout(paintPriceBtn, 1500);
    }
    var th = e.target.closest("[data-thumb]");
    if (th) go(+th.dataset.thumb);
  });
  function paintPriceBtn() { $("[data-add-pd]").innerHTML = 'Add to basket — <span data-total></span>'; paintPrice(); }

  // Gallery: swipe on mobile (scroll-snap) with dots; thumbnails on desktop; click → full-screen viewer
  var track = $("[data-track]"), cur = 0;
  function go(i) { cur = i; track.scrollTo({ left: track.clientWidth * i, behavior: B.reduceMotion ? "auto" : "smooth" }); mark(); }
  function mark() {
    $$("[data-thumb]").forEach(function (b, i) { b.setAttribute("aria-current", i === cur); });
    $$("[data-dots] span").forEach(function (d, i) { d.classList.toggle("is-on", i === cur); });
  }
  track.addEventListener("scroll", function () { var i = Math.round(track.scrollLeft / track.clientWidth); if (i !== cur) { cur = i; mark(); } }, { passive: true });
  if (window.innerWidth <= 900) $("[data-dots]").style.display = "flex";

  var lb = $("#lightbox"), stage = $(".lightbox__stage", lb);
  function lbShow(i) { cur = (i + p.images.length) % p.images.length; stage.innerHTML = B.productImg(p, cur, "scene"); }
  $("[data-open-lb]").addEventListener("click", function (e) { if (e.target.closest(".fav-btn")) return; lbShow(cur); lb.classList.add("is-open"); });
  lb.addEventListener("click", function (e) { var a = e.target.closest("[data-lb]"); if (e.target === lb || (a && a.dataset.lb === "close")) lb.classList.remove("is-open"); else if (a) lbShow(cur + (a.dataset.lb === "next" ? 1 : -1)); });
  document.addEventListener("keydown", function (e) { if (!lb.classList.contains("is-open")) return; if (e.key === "Escape") lb.classList.remove("is-open"); if (e.key === "ArrowRight") lbShow(cur + 1); if (e.key === "ArrowLeft") lbShow(cur - 1); });

  // Related: same category first, then quick meals
  var rel = D.products.filter(function (x) { return x.id !== p.id && x.cat === p.cat; }).concat(D.products.filter(function (x) { return x.cat === "swallow" || x.cat === "sides"; })).filter(function (x, i, a) { return x.id !== p.id && a.indexOf(x) === i; }).slice(0, 4);
  $("[data-related]").innerHTML = rel.map(function (x) { return B.productCard(x); }).join("");
});
</script>
</body>
</html>
